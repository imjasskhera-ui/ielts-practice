/* =========================================================
   SECTION TIMERS
   ========================================================= */

/*
   IELTS-style timing

   Listening:
   30 minutes test
   + 10 minutes transfer time

   Reading:
   60 minutes

   Writing:
   60 minutes

   Speaking:
   No official timer for the whole section,
   but Part 2 has a 1 minute preparation period
   and 1-2 minute speaking period.
*/

const sectionTimes = {

    listening: 30 * 60,

    reading: 60 * 60,

    writing: 60 * 60,

    speaking: 14 * 60
};


let currentSection = "listening";

let sectionTimeLeft = sectionTimes.listening;

let sectionTimer = null;

let listeningTransferMode = false;

let testStarted = false;

let testFinished = false;


/* =========================================================
   START TEST
   ========================================================= */

function startTest() {

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("testArea").style.display = "block";

    testStarted = true;

    currentSection = "listening";

    sectionTimeLeft = sectionTimes.listening;

    updateTimerDisplay();

    startSectionTimer();

    updateProgress();

    showSection("listening");
}


/* =========================================================
   START SECTION TIMER
   ========================================================= */

function startSectionTimer() {

    clearInterval(sectionTimer);

    sectionTimer = setInterval(function() {

        if (sectionTimeLeft <= 0) {

            clearInterval(sectionTimer);

            sectionFinished();

            return;
        }

        sectionTimeLeft--;

        updateTimerDisplay();

    }, 1000);
}


/* =========================================================
   TIMER DISPLAY
   ========================================================= */

function updateTimerDisplay() {

    const timer =
        document.getElementById("timer");

    if (!timer) return;


    const minutes =
        Math.floor(sectionTimeLeft / 60);

    const seconds =
        sectionTimeLeft % 60;


    const formattedSeconds =
        seconds < 10
            ? "0" + seconds
            : seconds;


    let title = "";


    if (currentSection === "listening") {

        if (listeningTransferMode) {

            title = "📝 Listening Answer Transfer";

        } else {

            title = "🎧 Listening";

        }

    }

    else if (currentSection === "reading") {

        title = "📖 Reading";

    }

    else if (currentSection === "writing") {

        title = "✍️ Writing";

    }

    else if (currentSection === "speaking") {

        title = "🗣️ Speaking";

    }


    timer.textContent =
        title +
        " • ⏱️ " +
        minutes +
        ":" +
        formattedSeconds;


    /* Warning */

    timer.style.background = "";

    timer.style.color = "";


    if (sectionTimeLeft <= 300) {

        timer.style.background =
            "#fff3cd";

        timer.style.color =
            "#856404";
    }


    if (sectionTimeLeft <= 60) {

        timer.style.background =
            "#f8d7da";

        timer.style.color =
            "#842029";
    }

}


/* =========================================================
   SECTION FINISHED
   ========================================================= */

function sectionFinished() {

    clearInterval(sectionTimer);


    if (
        currentSection === "listening" &&
        !listeningTransferMode
    ) {

        /*
           IELTS Listening has a transfer period.

           We give 10 minutes after the audio/test
           section for paper-style answer transfer.
        */

        listeningTransferMode = true;

        sectionTimeLeft = 10 * 60;

        updateTimerDisplay();

        alert(
            "🎧 Listening test finished.\n\n" +
            "You now have 10 minutes to check and transfer your answers."
        );

        startSectionTimer();

        return;
    }


    if (currentSection === "listening") {

        alert(
            "🎧 Listening section complete.\n\n" +
            "Moving to Reading."
        );

        listeningTransferMode = false;

        currentSection = "reading";

        sectionTimeLeft =
            sectionTimes.reading;

        showSection("reading");

        updateTimerDisplay();

        startSectionTimer();

        return;
    }


    if (currentSection === "reading") {

        alert(
            "📖 Reading section complete.\n\n" +
            "Moving to Writing."
        );

        currentSection = "writing";

        sectionTimeLeft =
            sectionTimes.writing;

        showSection("writing");

        updateTimerDisplay();

        startSectionTimer();

        return;
    }


    if (currentSection === "writing") {

        alert(
            "✍️ Writing section complete.\n\n" +
            "Moving to Speaking."
        );

        currentSection = "speaking";

        sectionTimeLeft =
            sectionTimes.speaking;

        showSection("speaking");

        updateTimerDisplay();

        startSectionTimer();

        return;
    }


    if (currentSection === "speaking") {

        finishTest();

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function showSection(sectionName) {

    document.querySelectorAll(".test-section")
        .forEach(function(section) {

            section.classList.remove("active");

        });


    const section =
        document.getElementById(sectionName);


    if (section) {

        section.classList.add("active");

    }


    document.querySelectorAll(".nav-btn")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    document.querySelectorAll(".nav-btn")
        .forEach(function(button) {

            const text =
                button.textContent
                    .toLowerCase();

            if (
                text.includes(sectionName)
            ) {

                button.classList.add("active");

            }

        });


    currentSection = sectionName;


    /*
       Do NOT reset the timer when navigating.
       Each section keeps its own timer.
    */


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    updateTimerDisplay();
}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress() {

    let completed = 0;


    /*
       LISTENING
    */

    for (let i = 1; i <= 40; i++) {

        const radio =
            document.querySelector(
                'input[name="l' + i + '"]:checked'
            );

        const input =
            document.getElementById(
                "l" + i
            );


        if (
            radio ||
            (
                input &&
                input.value.trim() !== ""
            )
        ) {

            completed++;

        }

    }


    /*
       READING
    */

    for (let i = 1; i <= 40; i++) {

        const radio =
            document.querySelector(
                'input[name="r' + i + '"]:checked'
            );

        const input =
            document.getElementById(
                "r" + i
            );


        if (
            radio ||
            (
                input &&
                input.value.trim() !== ""
            )
        ) {

            completed++;

        }

    }


    const progressText =
        document.getElementById(
            "progressText"
        );


    const progressFill =
        document.getElementById(
            "progressFill"
        );


    if (progressText) {

        progressText.textContent =
            "Progress: " +
            completed +
            " / 80 objective questions";

    }


    if (progressFill) {

        progressFill.style.width =
            (completed / 80 * 100) +
            "%";

    }

}


document.addEventListener(
    "change",
    updateProgress
);


document.addEventListener(
    "input",
    updateProgress
);


/* =========================================================
   WORD COUNT
   ========================================================= */

function updateWordCount(
    textId,
    countId
) {

    const textarea =
        document.getElementById(
            textId
        );


    const counter =
        document.getElementById(
            countId
        );


    if (!textarea || !counter) {

        return;

    }


    const text =
        textarea.value.trim();


    if (!text) {

        counter.textContent =
            "Words: 0";

        return;

    }


    const words =
        text.split(/\s+/).filter(Boolean);


    counter.textContent =
        "Words: " +
        words.length;


    /*
       Writing task minimum indicators
    */

    if (textId === "writing1") {

        if (words.length >= 150) {

            counter.textContent =
                "Words: " +
                words.length +
                " ✓ Minimum reached";

        } else {

            counter.textContent =
                "Words: " +
                words.length +
                " • Minimum: 150";

        }

    }


    if (textId === "writing2") {

        if (words.length >= 250) {

            counter.textContent =
                "Words: " +
                words.length +
                " ✓ Minimum reached";

        } else {

            counter.textContent =
                "Words: " +
                words.length +
                " • Minimum: 250";

        }

    }

}


/* =========================================================
   NORMALIZE ANSWERS
   ========================================================= */

function normalizeAnswer(answer) {

    return String(answer || "")
        .trim()
        .toLowerCase()
        .replace(/[.,!?;:]/g, "")
        .replace(/\s+/g, " ");

}


/* =========================================================
   ACCEPT MULTIPLE POSSIBLE ANSWERS
   ========================================================= */

function answerMatches(
    userAnswer,
    correctAnswer
) {

    const user =
        normalizeAnswer(
            userAnswer
        );


    const correct =
        normalizeAnswer(
            correctAnswer
        );


    if (!user || !correct) {

        return false;

    }


    /*
       Allow answer key like:

       "bike|bicycle"

       Either answer will be accepted.
    */

    const alternatives =
        correct
            .split("|")
            .map(function(answer) {

                return answer.trim();

            });


    return alternatives.includes(user);

}


/* =========================================================
   READING SCORER
   ========================================================= */

function checkReading() {

    let score = 0;


    for (let i = 1; i <= 40; i++) {

        const key =
            "r" + i;


        let userAnswer = "";


        const radio =
            document.querySelector(
                'input[name="' +
                key +
                '"]:checked'
            );


        const field =
            document.getElementById(
                key
            );


        if (radio) {

            userAnswer =
                radio.value;

        }

        else if (field) {

            userAnswer =
                field.value;

        }


        if (
            answerMatches(
                userAnswer,
                readingAnswers[key]
            )
        ) {

            score++;

        }

    }


    return score;

}


/* =========================================================
   LISTENING SCORER
   ========================================================= */

function checkListening() {

    let score = 0;

    let availableAnswers = 0;


    for (let i = 1; i <= 40; i++) {

        const key =
            "l" + i;


        const correct =
            listeningAnswers[key];


        /*
           Ignore empty answer-key entries.

           This prevents an empty answer key
           from accidentally giving students marks.
        */

        if (
            !correct ||
            !String(correct).trim()
        ) {

            continue;

        }


        availableAnswers++;


        let userAnswer = "";


        const radio =
            document.querySelector(
                'input[name="' +
                key +
                '"]:checked'
            );


        const field =
            document.getElementById(
                key
            );


        if (radio) {

            userAnswer =
                radio.value;

        }

        else if (field) {

            userAnswer =
                field.value;

        }


        if (
            answerMatches(
                userAnswer,
                correct
            )
        ) {

            score++;

        }

    }


    /*
       If answer key isn't installed,
       don't pretend the student got 0.
    */

    if (availableAnswers === 0) {

        return null;

    }


    return score;

}


/* =========================================================
   IELTS BAND CONVERSION
   ========================================================= */

function getBand(score) {

    if (score === null) {

        return "Not scored";

    }


    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 33) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 27) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 19) return "5.5";
    if (score >= 15) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";

    return "2.0 or below";

}


/* =========================================================
   OVERALL BAND
   ========================================================= */

function calculateOverallBand(
    listeningBand,
    readingBand
) {

    /*
       For now this calculates the average
       of Listening and Reading only.

       Writing and Speaking are manually assessed
       until you add an automated rubric.
    */

    if (
        listeningBand === null ||
        readingBand === null
    ) {

        return "—";

    }


    const average =
        (
            parseFloat(listeningBand) +
            parseFloat(readingBand)
        ) / 2;


    /*
       IELTS rounds to nearest half band.

       Examples:

       6.25 -> 6.5
       6.75 -> 7.0
       7.10 -> 7.0
    */

    const rounded =
        Math.round(
            average * 2
        ) / 2;


    return rounded.toFixed(1);

}


/* =========================================================
   WRITING STATUS
   ========================================================= */

function getWritingStatus() {

    const task1 =
        document.getElementById(
            "writing1"
        );


    const task2 =
        document.getElementById(
            "writing2"
        );


    const words1 =
        task1
            ? task1.value
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .length
            : 0;


    const words2 =
        task2
            ? task2.value
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .length
            : 0;


    return {

        task1: words1,

        task2: words2,

        task1Ready: words1 >= 150,

        task2Ready: words2 >= 250

    };

}


/* =========================================================
   SPEAKING STATUS
   ========================================================= */

function getSpeakingStatus() {

    return {
        status:
            "Manual assessment required"
    };

}


/* =========================================================
   FINISH TEST
   ========================================================= */

function finishTest() {

    if (testFinished) {

        return;

    }


    const confirmFinish =
        confirm(
            "Are you sure you want to finish the test?\n\n" +
            "Your answers will be scored and your final results will be displayed."
        );


    if (!confirmFinish) {

        return;

    }


    testFinished = true;


    clearInterval(sectionTimer);


    /*
       SCORES
    */

    const readingScore =
        checkReading();


    const listeningScore =
        checkListening();


    const readingBand =
        getBand(
            readingScore
        );


    const listeningBand =
        getBand(
            listeningScore
        );


    const overallBand =
        calculateOverallBand(
            listeningScore,
            readingScore
        );


    const writing =
        getWritingStatus();


    const speaking =
        getSpeakingStatus();


    /*
       HIDE TEST
    */

    document.getElementById(
        "testArea"
    ).style.display = "none";


    /*
       SHOW RESULTS
    */

    document.getElementById(
        "results"
    ).style.display = "block";


    /*
       LISTENING
    */

    const listeningScoreElement =
        document.getElementById(
            "listeningScore"
        );


    if (listeningScoreElement) {

        if (listeningScore === null) {

            listeningScoreElement.textContent =
                "Not scored";

        }

        else {

            listeningScoreElement.textContent =
                listeningScore +
                " / 40";

        }

    }


    /*
       READING
    */

    const readingScoreElement =
        document.getElementById(
            "readingScore"
        );


    if (readingScoreElement) {

        readingScoreElement.textContent =
            readingScore +
            " / 40";

    }


    /*
       TOTAL
    */

    const totalScoreElement =
        document.getElementById(
            "totalScore"
        );


    if (totalScoreElement) {

        if (listeningScore === null) {

            totalScoreElement.textContent =
                readingScore +
                " / 40";

        }

        else {

            totalScoreElement.textContent =
                (
                    listeningScore +
                    readingScore
                ) +
                " / 80";

        }

    }


    /*
       BAND

       Your existing HTML has #band.
    */

    const bandElement =
        document.getElementById(
            "band"
        );


    if (bandElement) {

        bandElement.textContent =
            "Reading: Band " +
            readingBand +
            " • Listening: Band " +
            listeningBand +
            " • Objective Overall: " +
            overallBand;

    }


    /*
       ADD EXTRA RESULTS
       if result container exists
    */

    createDetailedResults(
        readingScore,
        listeningScore,
        readingBand,
        listeningBand,
        overallBand,
        writing,
        speaking
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   DETAILED RESULTS
   ========================================================= */

function createDetailedResults(

    listeningScore,
    readingBand,
    listeningBand,
    overallBand,
    writing,

                        listeningScore === null

                        : listeningScore + " / 40"
                    }
                    <br>
                    ${
                        listeningScore === null
                        ? "—"
                        : "Band " + listeningBand
                    }
                </div>


                <div style="

                    padding:15px;
                    border-radius:10px;
                    text-align:center;
                ">
                    <strong>📖 Reading</strong>
                    <br>

                    Band ${readingBand}
                </div>


                <div style="

                    padding:15px;
                    border-radius:10px;
                    text-align:center;
                ">
                    <strong>✍️ Writing</strong>
                    <br>
                    Task 1:
                    ${writing.task1} words
                    <br>
                    Task 2:
                    ${writing.task2} words
                    <br>
                    Manual band required
                </div>


                <div style="
                    background:#eef4fb;
                    padding:15px;
                    border-radius:10px;
                    text-align:center;
                ">
                    <strong>🗣️ Speaking</strong>
                    <br>
                    Manual assessment
                    <br>
                    required
                </div>

            </div>


            <div style="
                margin-top:18px;
                padding:15px;
                background:#f8f9fa;
                border-radius:10px;
            ">

                <strong>
                    🎯 Objective Overall Band:
                </strong>

                <span style="
                    font-size:24px;
                    font-weight:bold;
                    margin-left:8px;
                ">
                    ${overallBand}
                </span>

                <p style="
                    margin-bottom:0;
                    color:#666;
                ">
                    This objective band is based on
                    Reading and Listening only.
                    Writing and Speaking require
                    assessment using IELTS-style criteria.
                </p>

            </div>

        </div>

    `;


    /*
       Insert before the buttons.
    */

    const buttons =
        resultCard.querySelector(
            "button"
        );


    if (buttons) {

        resultCard.insertBefore(
            panel,
            buttons
        );

    }

    else {

        resultCard.appendChild(
            panel
        );

    }

}


/* =========================================================
   PREVENT ACCIDENTAL PAGE LEAVE
   ========================================================= */

window.addEventListener(
    "beforeunload",
    function(event) {

        if (
            testStarted &&
            !testFinished
        ) {

            event.preventDefault();

            event.returnValue = "";

        }

    }
);


/* =========================================================
   KEYBOARD SHORTCUT
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           Ctrl + Enter
           = Finish test
        */

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            if (
                testStarted &&
                !testFinished
            ) {

                finishTest();

            }

        }

    }
);


/* =========================================================
   INITIAL DISPLAY
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateProgress();

        updateTimerDisplay();

    }
);

</script>
