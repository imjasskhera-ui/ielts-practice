/* =====================================================
   PASSAGE GENERATOR
===================================================== */

function createPassage(topic, testNumber, passageNumber){

    const paragraphs = [

        `Research into ${topic.toLowerCase()} has become increasingly
        important in recent years. Young people encounter this subject
        in schools, communities and everyday life. Understanding the
        basic ideas can help students make informed decisions and
        develop useful knowledge.`,

        `One important aspect of ${topic.toLowerCase()} is the way it
        affects individuals and communities. People may have different
        experiences depending on where they live, their age and the
        resources available to them. Researchers often examine these
        differences when studying the subject.`,

        `Education can play an important role in improving people's
        understanding of ${topic.toLowerCase()}. Schools can introduce
        students to new information, while libraries, museums and online
        resources can provide additional opportunities for learning.`,

        `Technology has also changed the way people learn about
        ${topic.toLowerCase()}. Digital resources allow information to
        be shared quickly. However, students still need to evaluate
        information carefully and decide which sources are reliable.`,

        `Experts generally agree that regular learning and practical
        experience can help people develop a stronger understanding of
        ${topic.toLowerCase()}. Small changes in behaviour can sometimes
        have a positive effect on individuals as well as the wider
        community.`,

        `The future of ${topic.toLowerCase()} may depend on cooperation
        between individuals, schools, businesses and governments.
        Different groups can contribute ideas and resources to address
        challenges and create useful opportunities.`
    ];

    return `
        <h2>Passage ${passageNumber} — ${topic}</h2>

        <div class="paragraph">
        <strong>Paragraph A</strong><br>
        ${paragraphs[0]}
        </div>

        <div class="paragraph">
        <strong>Paragraph B</strong><br>
        ${paragraphs[1]}
        </div>

        <div class="paragraph">
        <strong>Paragraph C</strong><br>
        ${paragraphs[2]}
        </div>

        <div class="paragraph">
        <strong>Paragraph D</strong><br>
        ${paragraphs[3]}
        </div>

        <div class="paragraph">
        <strong>Paragraph E</strong><br>
        ${paragraphs[4]}
        </div>

        <div class="paragraph">
        <strong>Paragraph F</strong><br>
        ${paragraphs[5]}
        </div>
    `;
}

/* =====================================================
   BUILD ALL 25 TESTS
===================================================== */

for(let i = 0; i < 25; i++){

    const topics = testTopics[i];

    readingTests.push({

        title:`IELTS Reading Practice Test ${i + 1}`,

        description:
        `Complete three reading passages and 40 questions. Practice Test ${i + 1}.`,

        passages:[
            {
                title:`Passage 1 — ${topics[0]}`,
                text:createPassage(topics[0],i+1,1)
            },

            {
                title:`Passage 2 — ${topics[1]}`,
                text:createPassage(topics[1],i+1,2)
            },

            {
                title:`Passage 3 — ${topics[2]}`,
                text:createPassage(topics[2],i+1,3)
            }
        ],

        questions:createQuestions(topics)

    });

}


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentTestIndex = 0;
let currentTest = null;
let timerInterval = null;
let readingSeconds = 3600;
let submitted = false;


/* =====================================================
   SHOW SECTION
===================================================== */

function showSection(id){

    document
    .querySelectorAll(".section")
    .forEach(function(section){

        section.classList.remove("active");

    });

    const section =
        document.getElementById(id);

    if(section){

        section.classList.add("active");

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   RANDOM TEST
===================================================== */

function startRandomTest(){

    currentTestIndex =
        Math.floor(
            Math.random() *
            readingTests.length
        );

    loadReadingTest();

}


/* =====================================================
   SELECTED TEST
===================================================== */

function startSelectedTest(){

    currentTestIndex =
        parseInt(
            document.getElementById("testNumber").value,
            10
        );

    loadReadingTest();

}


/* =====================================================
   LOAD TEST
===================================================== */

function loadReadingTest(){

    currentTest =
        readingTests[currentTestIndex];

    submitted = false;

    document.getElementById("testTitle")
    .textContent =
        currentTest.title;

    document.getElementById("testDescription")
    .textContent =
        currentTest.description;


    document.getElementById("passage1")
    .innerHTML =
        currentTest.passages[0].text;

    document.getElementById("passage2")
    .innerHTML =
        currentTest.passages[1].text;

    document.getElementById("passage3")
    .innerHTML =
        currentTest.passages[2].text;


    renderQuestions();

    resetTimer();

    document
    .getElementById("readingResult")
    .classList.add("hidden");

    showSection("readingTest");

}


/* =====================================================
   RENDER QUESTIONS
===================================================== */

function renderQuestions(){

    const containers = [

        document.getElementById("questions1"),
        document.getElementById("questions2"),
        document.getElementById("questions3")

    ];

    containers.forEach(function(container){

        container.innerHTML = "";

    });


    currentTest.questions.forEach(function(q,index){

        let container;

        if(index < 13){

            container = containers[0];

        }

        else if(index < 26){

            container = containers[1];

        }

        else{

            container = containers[2];

        }


        const div =
            document.createElement("div");

        div.className = "question";


        let html =
            `<h3>Question ${q.number}</h3>
             <p>${q.question}</p>`;


        if(q.type === "mc"){

            q.options.forEach(function(option){

                html += `

                <label class="option">

                <input
                type="radio"
                name="q${q.number}"
                value="${option}">

                ${option}

                </label>

                `;

            });

        }


        else if(q.type === "tf"){

            html += `

            <label class="option">
            <input
            type="radio"
            name="q${q.number}"
            value="TRUE">
            TRUE
            </label>

            <label class="option">
            <input
            type="radio"
            name="q${q.number}"
            value="FALSE">
            FALSE
            </label>

            <label class="option">
            <input
            type="radio"
            name="q${q.number}"
            value="NOT GIVEN">
            NOT GIVEN
            </label>

            `;

        }


        else if(q.type === "text"){

            html += `

            <input
            type="text"
            id="q${q.number}"
            placeholder="Write your answer">

            `;

        }


        div.innerHTML = html;

        container.appendChild(div);

    });


    updateProgress();

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    if(!currentTest){

        return;

    }

    let answered = 0;

    currentTest.questions.forEach(function(q){

        if(q.type === "text"){

            const input =
                document.getElementById(
                    "q" + q.number
                );

            if(
                input &&
                input.value.trim() !== ""
            ){

                answered++;

            }

        }

        else{

            const selected =
                document.querySelector(
                    `input[name="q${q.number}"]:checked`
                );

            if(selected){

                answered++;

            }

        }

    });


    const percent =
        answered /
        40 *
        100;


    document.getElementById(
        "readingProgress"
    ).style.width =
        percent + "%";

}


/* =====================================================
   ANSWER TRACKING
===================================================== */

document.addEventListener(
    "change",
    updateProgress
);

document.addEventListener(
    "input",
    updateProgress
);


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeAnswer(answer){

    return String(answer)
    .trim()
    .toLowerCase()
    .replace(/[.,!?]/g,"");

}


/* =====================================================
   BAND
===================================================== */

function calculateBand(score){

    if(score >= 39) return "9.0";
    if(score >= 37) return "8.5";
    if(score >= 35) return "8.0";
    if(score >= 33) return "7.5";
    if(score >= 30) return "7.0";
    if(score >= 27) return "6.5";
    if(score >= 23) return "6.0";
    if(score >= 19) return "5.5";
    if(score >= 15) return "5.0";
    if(score >= 13) return "4.5";
    if(score >= 10) return "4.0";

    return "Below 4.0";

}


/* =====================================================
   SUBMIT
===================================================== */

function submitReading(){

    if(submitted){

        return;

    }

    const confirmSubmit =
        confirm(
            "Are you sure you want to submit the Reading test?"
        );

    if(!confirmSubmit){

        return;

    }

    submitted = true;

    pauseTimer();

    let score = 0;

    let review = "";


    currentTest.questions.forEach(function(q){

        let userAnswer = "";


        if(q.type === "text"){

            const input =
                document.getElementById(
                    "q" + q.number
                );

            if(input){

                userAnswer =
                    input.value.trim();

            }

        }

        else{

            const selected =
                document.querySelector(
                    `input[name="q${q.number}"]:checked`
                );

            if(selected){

                userAnswer =
                    selected.value;

            }

        }


        const isCorrect =
            normalizeAnswer(userAnswer) ===
            normalizeAnswer(q.answer);


        if(isCorrect){

            score++;

        }


        review += `

        <div class="review-item
        ${isCorrect
            ? "review-correct"
            : "review-wrong"}">

        <strong>
        Question ${q.number}
        </strong>

        <br>

        Your answer:
        ${userAnswer || "No answer"}

        <br>

        Correct answer:
        ${q.answer}

        <br>

        ${isCorrect
            ? "✅ Correct"
            : "❌ Incorrect"}

        </div>

        `;

    });


    const band =
        calculateBand(score);


    document.getElementById(
        "readingResult"
    ).innerHTML = `

        <h2>📊 Reading Test Result</h2>

        <p class="score">
        Score: ${score} / 40
        </p>

        <p class="band">
        Estimated IELTS Band: ${band}
        </p>

        <hr>

        <p>
        Correct answers:
        <strong>${score}</strong>
        </p>

        <p>
        Incorrect answers:
        <strong>${40 - score}</strong>
        </p>

        <hr>

        <h2>🔍 Answer Review</h2>

        ${review}

        <br>

        <button
        onclick="showSection('readingHome')">

        📖 Choose Another Test

        </button>

    `;


    document.getElementById(
        "readingResult"
    ).classList.remove("hidden");


    window.scrollTo({

        top:
        document.getElementById(
            "readingResult"
        ).offsetTop,

        behavior:"smooth"

    });

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    if(timerInterval){

        return;

    }

    timerInterval =
        setInterval(function(){

            if(readingSeconds <= 0){

                clearInterval(timerInterval);

                timerInterval = null;

                readingSeconds = 0;

                updateTimer();

                alert(
                    "⏰ Reading time is finished!"
                );

                submitReading();

                return;

            }

            readingSeconds--;

            updateTimer();

        },1000);

}


function pauseTimer(){

    if(timerInterval){

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


function resetTimer(){

    pauseTimer();

    readingSeconds = 3600;

    updateTimer();

}


function updateTimer(){

    const element =
        document.getElementById(
            "readingTimer"
        );

    if(!element){

        return;

    }

    const minutes =
        Math.floor(
            readingSeconds / 60
        );

    const seconds =
        readingSeconds % 60;


    element.textContent =
        "⏱️ Time Remaining: "
        +
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(seconds).padStart(2,"0");


    element.classList.remove(
        "warning",
        "danger"
    );


    if(readingSeconds <= 600){

        element.classList.add(
            "danger"
        );

    }

    else if(readingSeconds <= 1200){

        element.classList.add(
            "warning"
        );

    }

}


/* =====================================================
   INITIALIZE TEST SELECTOR
===================================================== */

function initializeTestSelector(){

    const select =
        document.getElementById(
            "testNumber"
        );

    if(!select){

        return;

    }

    select.innerHTML = "";

    readingTests.forEach(function(test,index){

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            `Practice Test ${index + 1}`;

        select.appendChild(option);

    });

}


/* =====================================================
   START
===================================================== */

initializeTestSelector();

updateTimer();

</script>
